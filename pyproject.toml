[project]
name = "treedist"
version = "0.1.0"
description = "Fördelningsmatriser för virke levererat till sågverk, från skördar- och leveransmätningar av olika säkerhet"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "pandas>=2.2"]

[project.scripts]
treedist = "treedist.cli:main"

[dependency-groups]
dev = ["pytest>=8.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/treedist"]

[tool.pytest.ini_options]
testpaths = ["tests"]
